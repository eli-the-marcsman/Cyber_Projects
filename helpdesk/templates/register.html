{% extends "base.html" %}
{% block title %}Register — HelpDesk{% endblock %}

{% block content %}
<style>
    .login-wrapper {
        min-height: calc(100vh - 60px);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: -2rem;
    }

    .login-card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 2.5rem;
        width: 100%;
        max-width: 420px;
    }

    .login-logo {
        text-align: center;
        margin-bottom: 2rem;
    }

    .login-logo .icon { font-size: 2.5rem; display: block; margin-bottom: 8px; }
    .login-logo h1 { font-size: 1.4rem; font-weight: 700; color: #f1f5f9; }
    .login-logo p  { font-size: 0.85rem; color: #64748b; margin-top: 4px; }

    .login-btn {
        width: 100%;
        padding: 11px;
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
        margin-top: 0.5rem;
    }

    .login-btn:hover { background: #15803d; }

    .error-msg {
        background: #3d0909;
        color: #f87171;
        border: 1px solid #dc2626;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.85rem;
        margin-bottom: 1.2rem;
    }

    .back-link {
        text-align: center;
        font-size: 0.85rem;
        color: #64748b;
        margin-top: 1rem;
    }

    .back-link a { color: #38bdf8; text-decoration: none; font-weight: 500; }
    .back-link a:hover { text-decoration: underline; }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <span class="icon">👤</span>
            <h1>Create Account</h1>
            <p>HelpDesk IT Ticketing System</p>
        </div>

        <div id="error-msg" class="error-msg" style="display:none"></div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Eli Marcus" />
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" />
        </div>

        <div class="form-group">
            <label>Role</label>
            <select id="role">
                <option value="user">User</option>
                <option value="technician">Technician</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button class="login-btn" onclick="register()">Create Account</button>

        <p class="back-link"><a href="/login">← Back to login</a></p>
    </div>
</div>

<script>
async function register() {
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const role     = document.getElementById('role').value;
    const errorEl  = document.getElementById('error-msg');

    if (!name || !email || !password) {
        errorEl.textContent = 'All fields are required.';
        errorEl.style.display = 'block';
        return;
    }

    const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, role })
    });

    const data = await res.json();

    if (res.ok) {
        window.location.href = '/login';
    } else {
        errorEl.textContent = data.error || 'Registration failed.';
        errorEl.style.display = 'block';
    }
}
</script>
{% endblock %}
