<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Help Desk{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* ── Navbar ── */
        nav {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-brand span { color: #e2e8f0; }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.15s;
        }

        .nav-links a:hover { background: #334155; color: #e2e8f0; }
        .nav-links a.active { background: #0ea5e9; color: white; }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-user {
            font-size: 0.8rem;
            color: #64748b;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-logout:hover { background: #dc2626; border-color: #dc2626; color: white; }

        /* ── Main layout ── */
        .main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.15s;
        }

        .btn-primary { background: #0ea5e9; color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-success { background: #16a34a; color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-ghost { background: #1e293b; border: 1px solid #334155; color: #94a3b8; }
        .btn-ghost:hover { background: #334155; color: #e2e8f0; }

        /* ── Cards ── */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.5rem;
        }

        /* ── Badges ── */
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .badge-open      { background: #0c4a6e; color: #38bdf8; }
        .badge-in_progress { background: #78350f; color: #fbbf24; }
        .badge-resolved  { background: #14532d; color: #4ade80; }
        .badge-closed    { background: #1e293b; color: #64748b; border: 1px solid #334155; }

        .badge-low      { background: #1e3a2e; color: #4ade80; }
        .badge-medium   { background: #1c3557; color: #60a5fa; }
        .badge-high     { background: #3d2409; color: #fb923c; }
        .badge-critical { background: #3d0909; color: #f87171; }

        .badge-hardware         { background: #2d1b69; color: #a78bfa; }
        .badge-software         { background: #0c4a6e; color: #38bdf8; }
        .badge-network          { background: #14532d; color: #4ade80; }
        .badge-security_incident{ background: #3d0909; color: #f87171; }

        /* ── Flash messages ── */
        .flash {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .flash-success { background: #14532d; color: #4ade80; border: 1px solid #16a34a; }
        .flash-error   { background: #3d0909; color: #f87171; border: 1px solid #dc2626; }

        /* ── Page header ── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .page-subtitle {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 2px;
        }

        /* ── Forms ── */
        .form-group { margin-bottom: 1.2rem; }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 14px;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.15s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0ea5e9;
        }

        select option { background: #1e293b; }
        textarea { resize: vertical; min-height: 100px; }
    </style>
</head>
<body>

{% if session.user_id %}
<nav>
    <a href="/dashboard" class="nav-brand">🎫 <span>HelpDesk</span></a>
    <div class="nav-links">
        <a href="/dashboard" {% if request.path == '/dashboard' %}class="active"{% endif %}>Dashboard</a>
        <a href="/tickets"   {% if request.path == '/tickets' %}class="active"{% endif %}>Tickets</a>
        <a href="/tickets/new" {% if request.path == '/tickets/new' %}class="active"{% endif %}>+ New Ticket</a>
    </div>
    <div class="nav-right">
        <span class="nav-user">Logged in</span>
        <form method="POST" action="/api/auth/logout" style="margin:0">
            <button class="btn-logout" type="submit">Logout</button>
        </form>
    </div>
</nav>
{% endif %}

<div class="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
